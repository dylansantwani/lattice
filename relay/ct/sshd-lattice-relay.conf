# Relay agent sessions: reap a vanished Mac (sleep, lid closed, network change) within ~30s so its
# reverse forward is released and the next connection can bind 127.0.0.1:18973 again.
Match User lattice
    ClientAliveInterval 10
    ClientAliveCountMax 3
    AllowTcpForwarding remote
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    X11Forwarding no
    PermitTTY no
